<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon-cloud.svg">
<title>腓利門 FIND</title>
<style>
:root {
  --bg: #F5F6F8;
  --white: #FFFFFF;
  --black: #0D0F12;
  --gray: #6B7280;
  --line: #E2E5EC;
  --blue: #1D4ED8;
  --blue-soft: #EFF4FF;
  --red: #DC2626;
  --red-soft: #FEF2F2;
  --shadow: 0 10px 28px -12px rgba(13, 15, 18, 0.12), 0 2px 6px -2px rgba(13, 15, 18, 0.05);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--black);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.num, .mono {
  font-variant-numeric: tabular-nums;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans TC", monospace;
}

.shell {
  max-width: 480px;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: 14px 16px 16px;
  gap: 12px;
}

/* Top Bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-marks {
  display: flex;
  gap: 3px;
}

.brand-marks i {
  width: 8px;
  height: 16px;
  border-radius: 2px;
  display: block;
}

.brand-marks .m-red { background: var(--red); }
.brand-marks .m-blue { background: var(--blue); }

.brand-txt {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.db-badge {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
}

.quote-pill {
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: none;
  background: var(--black);
  color: var(--white);
  font-size: 12.5px;
  font-weight: 800;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
}

/* Main Content Area */
.stage {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow: hidden;
}

/* Idle Welcome State (when search is empty) */
.idle-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px 12px;
  gap: 10px;
}

.idle-title {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.02em;
}

.idle-sub {
  font-size: 14px;
  color: var(--gray);
  line-height: 1.5;
}

.recent-wrap {
  width: 100%;
  margin-top: 14px;
  text-align: left;
}

.recent-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  margin-bottom: 8px;
  padding-left: 2px;
}

/* Hero Price Card */
.hero {
  flex-shrink: 0;
  background: var(--white);
  border: 1.5px solid var(--black);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
  display: none;
}

.hero.show {
  display: block;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.hero-code {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--gray);
  cursor: pointer;
}

.stock-pill {
  font-size: 12.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.stock-pill i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.st-ok { color: var(--blue); }
.st-ok i { background: var(--blue); }
.st-low, .st-out { color: var(--red); }
.st-low i, .st-out i { background: var(--red); }

.hero-name {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
}

.hero-price-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.price-wrap {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.price-nt {
  font-size: 13px;
  font-weight: 800;
  color: var(--gray);
}

.price-big {
  font-size: 46px;
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.04em;
  color: var(--blue);
}

.price-unit {
  font-size: 13px;
  color: var(--gray);
}

.add-btn {
  height: 44px;
  padding: 0 18px;
  border-radius: 10px;
  border: none;
  background: var(--black);
  color: var(--white);
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
}

.barcode-strip {
  margin-top: 14px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
}

.bars {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 15px;
}

.bars i {
  display: block;
  height: 100%;
  background: var(--black);
  border-radius: 1px;
}

/* OCR Status Banner */
.ocr-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--blue-soft);
  border: 1px solid #BFDBFE;
  color: var(--blue);
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.ocr-banner.show {
  display: flex;
}

/* Compact Match List (Max 8 items) */
.list-head {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--gray);
  flex-shrink: 0;
}

.list-head.show {
  display: flex;
}

.stream {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: none;
}

.stream::-webkit-scrollbar {
  display: none;
}

.item-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 14px;
  border-radius: 14px;
  background: var(--white);
  border: 1px solid var(--line);
  cursor: pointer;
}

.item-card.active {
  border-color: var(--blue);
  background: var(--blue-soft);
}

.ic-main {
  min-width: 0;
  flex: 1;
}

.ic-name {
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ic-name mark {
  background: var(--red-soft);
  color: var(--red);
  padding: 0 2px;
  border-radius: 2px;
}

.ic-sub {
  margin-top: 3px;
  font-size: 12px;
  color: var(--gray);
  display: flex;
  gap: 8px;
}

.ic-price {
  font-size: 17px;
  font-weight: 900;
  color: var(--black);
  flex-shrink: 0;
}

/* TWO-ROW GENEROUS THUMB-ZONE DOCK */
.dock-wrap {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 4px;
}

/* Row 1: Full-width big input box */
.big-search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 56px;
  padding: 0 10px 0 16px;
  border-radius: 16px;
  background: var(--white);
  border: 2px solid var(--black);
  box-shadow: var(--shadow);
}

.big-search-box:focus-within {
  border-color: var(--blue);
}

.big-search-box input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  background: transparent;
  color: var(--black);
  font-size: 18px;
  font-weight: 700;
  outline: none;
}

.big-search-box input::placeholder {
  color: var(--gray);
  font-weight: 400;
  font-size: 16px;
}

.clear-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: none;
  background: var(--bg);
  color: var(--black);
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  display: none;
  place-items: center;
  flex-shrink: 0;
}

.clear-btn.show {
  display: grid;
}

/* Row 2: Three large, easy-to-tap action buttons */
.action-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 8px;
}

.big-act {
  height: 50px;
  border-radius: 14px;
  border: 1.5px solid var(--black);
  background: var(--white);
  color: var(--black);
  font-size: 14.5px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
}

.big-act:active {
  transform: scale(0.97);
  background: var(--bg);
}

.big-act.listening {
  background: var(--red);
  border-color: var(--red);
  color: var(--white);
  animation: pulseRec 1s infinite;
}

@keyframes pulseRec {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.big-act.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: var(--white);
}

/* Modal Sheet */
.mask {
  position: fixed;
  inset: 0;
  background: rgba(13, 15, 18, 0.5);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 60;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.mask.open {
  opacity: 1;
  pointer-events: auto;
}

.sheet {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border-radius: 22px 22px 0 0;
  padding: 14px 20px 26px;
  transform: translateY(100%);
  transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  max-height: 82dvh;
  overflow-y: auto;
}

.mask.open .sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 99px;
  background: var(--line);
  margin: 0 auto 14px;
}

.cam-box {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--black);
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  margin-bottom: 12px;
}

.cam-box video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cam-laser {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 2px;
  background: var(--red);
  box-shadow: 0 0 12px var(--red);
}

.btn-full {
  width: 100%;
  height: 48px;
  border-radius: 12px;
  border: none;
  background: var(--blue);
  color: var(--white);
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.btn-outline {
  width: 100%;
  height: 46px;
  border-radius: 12px;
  border: 1.5px solid var(--black);
  background: var(--white);
  color: var(--black);
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
}

.q-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.q-step {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.q-step button {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
}

.q-step span {
  width: 26px;
  text-align: center;
  font-size: 14px;
  font-weight: 800;
}

.toast {
  position: fixed;
  left: 50%;
  top: 14px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -180%);
  background: var(--black);
  color: var(--white);
  padding: 9px 18px;
  border-radius: 99px;
  font-size: 13.5px;
  font-weight: 700;
  transition: transform 0.2s ease, opacity 0.2s ease;
  z-index: 100;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
</style>
</head>

<script>
const FALLBACK = [

  { code: 'OW-PEN-B02', barcode: '4712938401028', name: 'TJC躲躲筆黑桿黑貓/黑墨(歐文)', price: 29, qty: 18, spec: '黑墨 0.5mm', unit: '支' },
  { code: 'PH-CAL-2027', barcode: '4710002027019', name: '2027 桌曆限定版', price: 180, qty: 64, spec: '桌曆', unit: '本' },
  { code: 'PH-BAG-01', barcode: '4710008801024', name: '腓利門帆布袋', price: 250, qty: 15, spec: '厚磅純棉 A4', unit: '個' },
  { code: 'BK-DEV-901', barcode: '9789861234567', name: '靈修日引（精裝典藏版）', price: 220, qty: 11, spec: '精裝', unit: '本' },
  { code: 'S006D3', barcode: '4719900600032', name: '不鏽鋼聖餐壺', price: 450, qty: 3, spec: '304不鏽鋼', unit: '組' }
];

let products = [];
let codeIndex = new Map();
let state = { query: '', activeCode: '', quote: [], recent: [], ocrNote: '' };
let toastTimer = null;
let ocrRaw = '', ocrConfirmed = false, ocrGeneration = 0, ocrBusy = false;
function resetOCR(){ ocrGeneration++; ocrRaw = ''; ocrConfirmed = false; state.ocrNote = ''; }
let camStream = null, camRaf = null, html5Qr = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function hi(text, q) {
  const safe = esc(text);
  if (!q) return safe;
  const tokens = q.split(/\s+/).filter(Boolean).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!tokens.length) return safe;
  return safe.replace(new RegExp(`(${tokens.join('|')})`, 'gi'), '<mark>$1</mark>');
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function copyText(val, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(() => showToast(`已複製${label}`)).catch(() => fallbackCopy(val, label));
  } else fallbackCopy(val, label);
}

function fallbackCopy(val, label) {
  const ta = document.createElement('textarea');
  ta.value = val;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast(`已複製${label}`); }
  catch (e) { showToast('請長按複製'); }
  document.body.removeChild(ta);
}

async function fetchTextSmart(url) {
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const buf = await res.arrayBuffer();
  const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(buf);
  if (utf8.includes('\uFFFD')) {
    try { return new TextDecoder('big5').decode(buf); } catch (e) { return utf8; }
  }
  return utf8;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (inQ) {
      if (ch === '"' && next === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur.trim()); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && next === '\n') i++;
        row.push(cur.trim());
        if (row.some(Boolean)) rows.push(row);
        row = []; cur = '';
      } else cur += ch;
    }
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  if (!rows.length) return [];
  const header = rows[0].map(h => h.replace(/^\uFEFF/, '').trim().toUpperCase());
  return rows.slice(1).map(r => {
    const obj = {};
    header.forEach((h, idx) => obj[h] = r[idx] || '');
    return obj;
  });
}

function buildIndex(list) {
  codeIndex.clear();
  list.forEach(p => {
    codeIndex.set(p.code.toLowerCase(), p);
    if (p.barcode) codeIndex.set(p.barcode.toLowerCase(), p);
  });
}

async function loadData() {
  try {
    const [prodTxt, unitTxt] = await Promise.all([
      fetchTextSmart('PRODUCT.csv'),
      fetchTextSmart('PRODUNIT.csv').catch(() => '')
    ]);
    const unitMap = {};
    parseCSV(unitTxt).forEach(r => { if (r.CODE) unitMap[r.CODE] = r.CNAME || r.NAME || r.CODE; });
    const parsed = parseCSV(prodTxt).filter(r => r.CODE && r.CNAME).map(r => ({
      code: r.CODE,
      barcode: r.BARCODE || r.CODE,
      name: r.CNAME,
      price: Math.round(Number(r.PRICE1) || 0),
      qty: Math.round(Number(r.CQTY) || 0),
      spec: r.SPEC || '',
      unit: unitMap[r.UNIT] || '件'
    }));
    if (parsed.length) {
      products = parsed;
      buildIndex(products);
      if(window.FindOCR)window.FindOCR.index(products);
      document.getElementById('dbStatus').textContent = `${products.length.toLocaleString()} 筆`;
      render();
      return;
    }
  } catch (e) {}

  products = [...FALLBACK];
  buildIndex(products);
  if(window.FindOCR)window.FindOCR.index(products);
  document.getElementById('dbStatus').textContent = '離線預覽';
  render();
}

function recordRecent(code) {
  if (!code) return;
  state.recent = [code, ...state.recent.filter(c => c !== code)].slice(0, 4);
}

function getFiltered() {
  const q = state.query.trim().toLowerCase();
  if (!q) return { items: [], totalHits: 0 };
  if (ocrRaw && window.FindOCR) return window.FindOCR.rank(products, ocrRaw);
  const tokens = q.split(/\s+/).filter(Boolean);
  const scored = [];
  for (let i = 0; i < products.length; i++) {
    const p = products[i];
    const hay = `${p.name} ${p.code} ${p.barcode} ${p.spec}`.toLowerCase();
    let score = 0;
    if (p.code.toLowerCase() === q || p.barcode.toLowerCase() === q) score += 100;
    let allMatch = true;
    for (let j = 0; j < tokens.length; j++) {
      if (hay.includes(tokens[j])) score += 10;
      else allMatch = false;
    }
    if (allMatch || score >= 100) scored.push({ p, score });
  }
  scored.sort((a, b) => b.score - a.score);
  return { items: scored.slice(0, 8).map(x => x.p), totalHits: scored.length };
}

function drawBars(str) {
  let out = '';
  for (let i = 0; i < 18; i++) {
    const w = ((str.charCodeAt(i % str.length) || 48) % 3) + 1;
    out += `<i style="width:${w}px"></i>`;
  }
  return out;
}

function renderHero(item) {
  const hero = document.getElementById('heroCard');
  if (!item) { hero.classList.remove('show'); return; }
  hero.classList.add('show');
  document.getElementById('heroCode').textContent = `${item.code}${item.spec ? ' · ' + item.spec : ''}`;
  const stockEl = document.getElementById('heroStock');
  if (item.qty <= 0) {
    stockEl.className = 'stock-pill st-out';
    stockEl.innerHTML = '<i></i>缺貨';
  } else if (item.qty <= 5) {
    stockEl.className = 'stock-pill st-low';
    stockEl.innerHTML = `<i></i>低庫存 ${item.qty}`;
  } else {
    stockEl.className = 'stock-pill st-ok';
    stockEl.innerHTML = `<i></i>庫存 ${item.qty}`;
  }
  document.getElementById('heroName').textContent = item.name;
  document.getElementById('heroPrice').textContent = item.price.toLocaleString();
  document.getElementById('heroUnit').textContent = `/ ${item.unit}`;
  document.getElementById('heroBarcode').textContent = item.barcode;
  document.getElementById('barcodeBars').innerHTML = drawBars(item.barcode);
}

function renderQuotePill() {
  let cnt = 0, total = 0;
  state.quote.forEach(q => {
    const p = codeIndex.get(q.code.toLowerCase());
    if (p) { cnt += q.qty; total += p.price * q.qty; }
  });
  const pill = document.getElementById('quotePill');
  pill.style.display = cnt > 0 ? 'inline-flex' : 'none';
  document.getElementById('quotePillTxt').textContent = `${cnt} 件 · $${total.toLocaleString()}`;
}

function render() {
  const q = state.query.trim();
  document.getElementById('clearBtn').classList.toggle('show', q.length > 0);

  const banner = document.getElementById('ocrBanner');
  banner.classList.toggle('show', Boolean(state.ocrNote));
  if (state.ocrNote) document.getElementById('ocrBannerTxt').textContent = state.ocrNote;

  const idleBox = document.getElementById('idleBox');
  const listHead = document.getElementById('listHead');
  const stream = document.getElementById('stream');

  // Idle state: keep screen ultra-clean (no 80-item dump!)
  if (!q && !state.activeCode) {
    idleBox.style.display = 'flex';
    document.getElementById('heroCard').classList.remove('show');
    listHead.classList.remove('show');
    stream.style.display = 'none';

    const recentWrap = document.getElementById('recentWrap');
    const recentItems = state.recent.map(c => codeIndex.get(c.toLowerCase())).filter(Boolean);
    recentWrap.style.display = recentItems.length ? 'block' : 'none';
    document.getElementById('recentList').innerHTML = recentItems.map(p => `
      <div class="item-card" data-recent="${esc(p.code)}">
        <div class="ic-main">
          <div class="ic-name">${esc(p.name)}</div>
          <div class="ic-sub"><span class="mono">${esc(p.code)}</span><span>庫存 ${p.qty}</span></div>
        </div>
        <div class="ic-price num">$${p.price}</div>
      </div>
    `).join('');
    renderQuotePill();
    return;
  }

  idleBox.style.display = 'none';
  const { items, totalHits } = getFiltered();

  // If user tapped a recent item while query is empty, just show its hero card cleanly
  if (!q && state.activeCode) {
    const picked = codeIndex.get(state.activeCode.toLowerCase());
    renderHero(picked);
    listHead.classList.remove('show');
    stream.style.display = 'none';
    renderQuotePill();
    return;
  }

  let active = items.find(i => i.code === state.activeCode) || ((!ocrRaw || ocrConfirmed) ? items[0] : null) || null;
  if (active && (!ocrRaw || ocrConfirmed)) {
    state.activeCode = active.code;
    recordRecent(active.code);
  }
  renderHero(ocrRaw && !ocrConfirmed ? null : active);

  if (!items.length) {
    listHead.classList.add('show');
    document.getElementById('countLabel').textContent = '0 筆';
    stream.style.display = 'flex';
    stream.innerHTML = '<div style="padding:36px 0;text-align:center;color:var(--gray);font-size:14px">找不到符合的商品</div>';
  } else if (items.length === 1 && (!ocrRaw || ocrConfirmed)) {
    // Only 1 exact match: hero card already shows everything, hide redundant list!
    listHead.classList.remove('show');
    stream.style.display = 'none';
  } else {
    listHead.classList.add('show');
    document.getElementById('countLabel').textContent = totalHits > 8 ? `顯示前 8 / 共 ${totalHits} 筆` : `${totalHits} 筆`;
    stream.style.display = 'flex';
    stream.innerHTML = items.map(p => `
      <div class="item-card${active && p.code === active.code ? ' active' : ''}" data-code="${esc(p.code)}">
        <div class="ic-main">
          <div class="ic-name">${hi(p.name, q)}</div>
          <div class="ic-sub">
            <span class="mono">${esc(p.code)}</span>
            <span style="color:${p.qty <= 5 ? 'var(--red)' : 'var(--gray)'}">${p.qty <= 0 ? '缺貨' : '庫存 ' + p.qty}</span>
          </div>
        </div>
        <div class="ic-price num">$${p.price}</div>
      </div>
    `).join('');
  }

  renderQuotePill();
}

// 1. Voice Search (zh-TW)
function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('此瀏覽器不支援語音辨識'); return; }
  const btn = document.getElementById('voiceBtn');
  const rec = new SR();
  rec.lang = 'zh-TW';
  rec.interimResults = false;
  btn.classList.add('listening');
  rec.onresult = e => {
    const txt = e.results[0][0].transcript.trim();
    resetOCR();
    state.query = txt;
    state.activeCode = '';
    document.getElementById('searchInput').value = txt;
    render();
    showToast(`語音：${txt}`);
  };
  rec.onend = () => btn.classList.remove('listening');
  rec.onerror = () => { btn.classList.remove('listening'); showToast('語音已取消'); };
  rec.start();
}

// 2. Browser-local OCR: PaddleOCR.js with Tesseract fallback
let paddlePromise = null;
function limitOCR(promise, ms) {
  let timer;
  return Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('OCR timeout')),ms);})]).finally(()=>clearTimeout(timer));
}
async function paddleText(file) {
  if (!paddlePromise) {
    const pending = (async()=>{
      const {PaddleOCR} = await import('https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm');
      return PaddleOCR.create({lang:'chinese_cht',ocrVersion:'PP-OCRv5',worker:false,
        textDetectionBatchSize:1,textRecognitionBatchSize:1,
        ortOptions:{backend:'wasm',numThreads:1,wasmPaths:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.3/dist/'}});
    })();
    paddlePromise = pending;
    pending.catch(()=>{if(paddlePromise===pending)paddlePromise=null;});
  }
  const engine=await limitOCR(paddlePromise,45000);
  const [result]=await engine.predict(file,{textDetLimitSideLen:1280,textDetLimitType:'max',textDetMaxSideLimit:1600,textDetThresh:0.2,textDetBoxThresh:0.45,textRecScoreThresh:0.25});
  const items=(result?.items||[]).filter(x=>x.text);
  const lines=items.map(x=>x.text);
  // Reconstruct reading order for vertical Chinese covers using detection coordinates.
  const boxes=items.map(item=>{
    const pts=Array.isArray(item.poly)?item.poly:[];
    if(!pts.length||!pts.every(p=>Array.isArray(p)&&Number.isFinite(p[0])&&Number.isFinite(p[1])))return null;
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
    return {text:item.text,x:(Math.min(...xs)+Math.max(...xs))/2,y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
  }).filter(Boolean);
  if(boxes.length>1){
    const columns=[];
    for(const box of [...boxes].sort((a,b)=>b.x-a.x)){
      const col=columns.find(c=>Math.abs(c.x-box.x)<=Math.max(12,Math.min(c.w,box.w)*0.65));
      if(col)col.items.push(box);else columns.push({x:box.x,w:box.w,items:[box]});
    }
    const vertical=columns.map(c=>c.items.sort((a,b)=>a.y-b.y).map(b=>b.text).join('')).filter(Boolean);
    if(vertical.length)lines.push(...vertical,vertical.join(''));
  }
  return lines.join('\n');
}
async function tesseractText(file) {
  if (!window.Tesseract) await limitOCR(new Promise((res,rej)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    script.onload=res;script.onerror=rej;document.head.appendChild(script);
  }),30000);
  const result=await window.Tesseract.recognize(file,'chi_tra+eng');
  return String(result?.data?.text||'');
}
async function runTitleOCR(file) {
  if (ocrBusy) { showToast('辨識進行中'); return; }
  resetOCR();
  const generation = ocrGeneration;
  const started=performance.now();
  ocrBusy = true;
  state.query = ''; state.activeCode = ''; searchInput.value = '';
  state.ocrNote = '辨識中｜首次需載入模型…';
  render();
  try {
    let raw='', engine='PaddleOCR';
    if (new URLSearchParams(location.search).get('ocr') !== 'tesseract') {
      try {raw=await paddleText(file);} catch(e){console.warn('PaddleOCR unavailable',e);}
    }
    if(generation !== ocrGeneration)return;
    if (!raw.trim() || !window.FindOCR || !window.FindOCR.rank(products,raw).totalHits) {
      state.ocrNote='備援辨識中｜Tesseract…';render();
      const fallback=await tesseractText(file);
      if(fallback.trim()){raw=fallback;engine='Tesseract';}
    }
    if(generation !== ocrGeneration)return;
    if (!window.FindOCR || !window.FindOCR.norm(raw)) throw new Error('No text');
    ocrRaw = raw.slice(0,1600);
    state.query = raw.replace(/\s+/g,' ').trim().slice(0,100);
    searchInput.value = state.query;
    const searchStarted=performance.now();
    const matches=window.FindOCR.rank(products,ocrRaw);
    const searchMs=performance.now()-searchStarted;
    state.ocrNote = engine+' '+((performance.now()-started)/1000).toFixed(2)+'秒｜比對 '+searchMs.toFixed(1)+'ms'+(matches.totalHits?'｜請選擇商品':'｜無符合商品，可修改搜尋文字');
    render();
  } catch(e) {
    if(generation !== ocrGeneration)return;
    resetOCR(); render(); showToast('文字辨識失敗，請重拍或手動搜尋');
  } finally { ocrBusy = false; }
}

// 3. Live Camera Barcode Scanner
function stopCam() {
  if (camRaf) { cancelAnimationFrame(camRaf); camRaf = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  if (html5Qr) { try { html5Qr.stop().catch(() => {}); } catch (e) {} html5Qr = null; }
}

function closeMask() {
  stopCam();
  document.getElementById('mask').classList.remove('open');
}

function onBarcodeHit(raw) {
  const val = String(raw || '').trim();
  if (!val) return;
  closeMask();
  resetOCR();
  state.query = val;
  document.getElementById('searchInput').value = val;
  const hit = codeIndex.get(val.toLowerCase());
  state.activeCode = hit ? hit.code : '';
  render();
  showToast(hit ? `掃碼命中：$${hit.price}` : `查無條碼：${val}`);
}

async function openBarcodeCam() {
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div style="font-size:15px;font-weight:800;margin-bottom:10px">鏡頭對準條碼掃描</div>
    <div class="cam-box" id="camBox"><video id="camVideo" playsinline muted></video><div class="cam-laser"></div></div>
    <button type="button" class="btn-outline" data-close="1">關閉相機</button>
  `;
  document.getElementById('mask').classList.add('open');

  if ('BarcodeDetector' in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'qr_code'] });
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('camVideo');
      v.srcObject = camStream;
      await v.play();
      const loop = async () => {
        if (!camStream) return;
        try {
          const codes = await det.detect(v);
          if (codes.length && codes[0].rawValue) { onBarcodeHit(codes[0].rawValue); return; }
        } catch (e) {}
        camRaf = requestAnimationFrame(loop);
      };
      camRaf = requestAnimationFrame(loop);
      return;
    } catch (e) { stopCam(); }
  }

  try {
    if (!window.Html5Qrcode) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
    }
    document.getElementById('camBox').innerHTML = '<div id="qrReader" style="width:100%;height:100%"></div>';
    html5Qr = new Html5Qrcode('qrReader');
    await html5Qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 240, height: 120 } }, txt => onBarcodeHit(txt));
  } catch (e) {
    closeMask();
    showToast('無法開啟相機，請直接輸入條碼');
  }
}

function openQuoteSheet() {
  let total = 0;
  const rows = state.quote.map(entry => {
    const p = codeIndex.get(entry.code.toLowerCase());
    if (!p) return '';
    const sub = p.price * entry.qty;
    total += sub;
    return `
      <div class="q-row">
        <div style="min-width:0;flex:1">
          <div style="font-size:14.5px;font-weight:700">${esc(p.name)}</div>
          <div style="font-size:12.5px;color:var(--gray)" class="num">$${p.price} × ${entry.qty} = $${sub}</div>
        </div>
        <div class="q-step">
          <button type="button" data-qcode="${esc(p.code)}" data-delta="-1">−</button>
          <span class="num">${entry.qty}</span>
          <button type="button" data-qcode="${esc(p.code)}" data-delta="1">+</button>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('sheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong style="font-size:16px">臨時查價試算（不記帳）</strong>
      <button type="button" style="border:none;background:transparent;color:var(--red);font-size:13.5px;font-weight:800;cursor:pointer" data-clear-q="1">清空</button>
    </div>
    ${rows}
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:16px 0">
      <span style="font-size:13.5px;color:var(--gray);font-weight:700">小計</span>
      <span class="num" style="font-size:26px;font-weight:900;color:var(--blue)">NT$ ${total.toLocaleString()}</span>
    </div>
    <button type="button" class="btn-full" data-copy-q="1">複製報價文字</button>
  `;
  document.getElementById('mask').classList.add('open');
}

// Event bindings
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', e => {
  resetOCR();
  state.activeCode = '';
  state.query = e.target.value;
  if (!state.query.trim()) {
    state.activeCode = '';
    state.ocrNote = '';
  }
  render();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  resetOCR(); state.query = ''; state.activeCode = '';
  searchInput.value = '';
  searchInput.focus();
  render();
});

document.getElementById('clearOcrBtn').addEventListener('click', () => {
  resetOCR(); state.query = ''; state.activeCode = '';
  searchInput.value = '';
  render();
});

document.getElementById('stream').addEventListener('click', e => {
  const card = e.target.closest('.item-card');
  if (!card) return;
  ocrConfirmed = true;
  state.activeCode = card.dataset.code;
  recordRecent(state.activeCode);
  render();
});

document.getElementById('recentList').addEventListener('click', e => {
  const card = e.target.closest('[data-recent]');
  if (!card) return;
  state.activeCode = card.dataset.recent;
  render();
});

document.getElementById('heroAddBtn').addEventListener('click', () => {
  if (!state.activeCode || (ocrRaw && !ocrConfirmed)) return;
  const found = state.quote.find(q => q.code === state.activeCode);
  if (found) found.qty += 1;
  else state.quote.unshift({ code: state.activeCode, qty: 1 });
  renderQuotePill();
  showToast('已加入試算');
});

document.getElementById('heroCode').addEventListener('click', () => {
  if (state.activeCode) copyText(state.activeCode, '代碼');
});

document.getElementById('barcodeStrip').addEventListener('click', () => {
  const p = codeIndex.get((state.activeCode || '').toLowerCase());
  if (p) copyText(p.barcode, '條碼');
});

document.getElementById('voiceBtn').addEventListener('click', startVoice);
document.getElementById('ocrBtn').addEventListener('click', () => document.getElementById('ocrInput').click());
document.getElementById('ocrInput').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) runTitleOCR(f);
  e.target.value = '';
});
document.getElementById('barcodeBtn').addEventListener('click', openBarcodeCam);
document.getElementById('quotePill').addEventListener('click', openQuoteSheet);

document.getElementById('mask').addEventListener('click', e => {
  if (e.target.id === 'mask' || e.target.closest('[data-close]')) { closeMask(); return; }
  const step = e.target.closest('[data-qcode]');
  if (step) {
    const idx = state.quote.findIndex(q => q.code === step.dataset.qcode);
    if (idx > -1) {
      state.quote[idx].qty += Number(step.dataset.delta);
      if (state.quote[idx].qty <= 0) state.quote.splice(idx, 1);
      renderQuotePill();
      if (state.quote.length) openQuoteSheet();
      else closeMask();
    }
    return;
  }
  if (e.target.closest('[data-clear-q]')) {
    state.quote = []; renderQuotePill(); closeMask(); showToast('已清空試算'); return;
  }
  if (e.target.closest('[data-copy-q]')) {
    let total = 0;
    const lines = state.quote.map(entry => {
      const p = codeIndex.get(entry.code.toLowerCase());
      if (!p) return '';
      const sub = p.price * entry.qty;
      total += sub;
      return `• ${p.name} × ${entry.qty}（$${sub}）`;
    }).filter(Boolean);
    copyText(`【腓利門商品查價】\n${lines.join('\n')}\n總計：NT$ ${total.toLocaleString()}`, '報價');
  }
});

loadData();
